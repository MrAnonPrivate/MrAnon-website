
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>MrAnon Comin soon</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800;900&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #050505;
    --cyan: #00f0ff;
    --purple: #a855f7;
    --white: #e9faff;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    background: var(--bg);
    color: var(--white);
    font-family: 'Vazirmatn', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Animated background */
.background {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
        radial-gradient(ellipse at 50% 45%,
        rgba(0, 240, 255, .09), transparent 48%),
        radial-gradient(ellipse at 80% 80%,
        rgba(168, 85, 247, .09), transparent 40%),
        #050505;
}

.grid {
    position: fixed;
    inset: -50%;
    z-index: 0;
    background-image:
        linear-gradient(rgba(0,240,255,.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,240,255,.07) 1px, transparent 1px);
    background-size: 45px 45px;
    transform: perspective(500px) rotateX(55deg);
    animation: gridMove 12s linear infinite;
    mask-image: linear-gradient(transparent, black 30%, black 75%, transparent);
}

@keyframes gridMove {
    from { background-position: 0 0; }
    to { background-position: 0 450px; }
}

/* Scan lines */
.scanlines {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0,0,0,.18) 4px
    );
}

/* Main panel */
.container {
    position: relative;
    z-index: 2;
    width: min(900px, 92%);
    padding: 55px 25px;
    text-align: center;
    animation: appear 1.2s ease both;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
}

.status {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 17px;
    border: 1px solid rgba(0,240,255,.35);
    background: rgba(0,240,255,.04);
    color: var(--cyan);
    font-size: 12px;
    letter-spacing: 2px;
    margin-bottom: 35px;
}

.status-dot {
    width: 7px;
    height: 7px;
    background: var(--cyan);
    border-radius: 50%;
    box-shadow: 0 0 12px var(--cyan);
    animation: blink 1s infinite;
}

@keyframes blink {
    50% { opacity: .2; }
}

h1 {
    font-size: clamp(34px, 7vw, 76px);
    font-weight: 900;
    line-height: 1.5;
    color: white;
    text-shadow: 0 0 25px rgba(0,240,255,.22);
    position: relative;
}

h1 span {
    color: var(--cyan);
    text-shadow: 0 0 25px rgba(0,240,255,.55);
}

.subtitle {
    margin: 18px auto 0;
    color: #8a9ba5;
    font-size: clamp(13px, 2vw, 16px);
    line-height: 2.3;
    max-width: 570px;
}

.divider {
    width: 100px;
    height: 2px;
    margin: 32px auto;
    background: linear-gradient(90deg, transparent, var(--cyan), var(--purple), transparent);
    box-shadow: 0 0 15px var(--cyan);
}

.details {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 30px;
}

.detail {
    border: 1px solid #242a31;
    background: rgba(255,255,255,.025);
    padding: 13px 19px;
    min-width: 155px;
    transition: .3s;
}

.detail:hover {
    border-color: var(--cyan);
    background: rgba(0,240,255,.06);
    transform: translateY(-4px);
    box-shadow: 0 0 20px rgba(0,240,255,.07);
}

.detail small {
    display: block;
    color: #697984;
    font-size: 10px;
    margin-bottom: 6px;
}

.detail strong {
    font-size: 13px;
    font-weight: 600;
    color: #d9faff;
}

.footer {
    margin-top: 45px;
    font-size: 11px;
    color: #53616a;
    letter-spacing: 1px;
}

.footer span {
    color: var(--cyan);
}

.corner {
    position: fixed;
    width: 35px;
    height: 35px;
    border-color: var(--cyan);
    opacity: .7;
    z-index: 3;
}

.top-right {
    top: 25px;
    right: 25px;
    border-top: 1px solid;
    border-right: 1px solid;
}

.top-left {
    top: 25px;
    left: 25px;
    border-top: 1px solid;
    border-left: 1px solid;
}

.bottom-right {
    bottom: 25px;
    right: 25px;
    border-bottom: 1px solid;
    border-right: 1px solid;
}

.bottom-left {
    bottom: 25px;
    left: 25px;
    border-bottom: 1px solid;
    border-left: 1px solid;
}

#particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
}

@media (max-width: 600px) {
    .container { padding: 35px 10px; }
    .status { margin-bottom: 25px; }
    .detail { min-width: 135px; padding: 12px; }
    .footer { margin-top: 30px; }
    .corner { width: 20px; height: 20px; }
}
</style>
</head>

<body>

<div class="background"></div>
<div class="grid"></div>
<canvas id="particles"></canvas>
<div class="scanlines"></div>

<div class="corner top-right"></div>
<div class="corner top-left"></div>
<div class="corner bottom-right"></div>
<div class="corner bottom-left"></div>

<main class="container">

    <div class="status">
        <span class="status-dot"></span>
        ! Devleopers is working 
    </div>

    <h1>
       Website is <span> private</span><br>
        now
    </h1>

    <p class="subtitle">
       ما در حال ساخت بهترین سایت افشا هستم
        <br>
       وبسایت در حال راه اندازی است اماده بیگ بنگ باشید
    </p>

    <div class="divider"></div>

    <section class="details">

        <div class="detail">
            <small>Status</small>
            <strong>Working</strong>
        </div>

        <div class="detail">
            <small>System V</small>
            <strong>V 1.0.0</strong>
        </div>

        <div class="detail">
            <small>Network</small>
            <strong>Private</strong>
        </div>

    </section>

    <div class="footer">
        <span>©</span> MrAnon 2026 — ALL SYSTEMS RESERVED
        <br><br>
        coming soooooon
    </div>

</main>

<script>
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

let particles = [];
let width, height;

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;

    const count = Math.min(100, Math.floor(width / 12));

    particles = Array.from({ length: count }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        size: Math.random() * 1.8 + .4,
        speed: Math.random() * .5 + .15,
        alpha: Math.random() * .6 + .2
    }));
}

function animate() {
    ctx.clearRect(0, 0, width, height);

    particles.forEach(p => {
        p.y -= p.speed;

        if (p.y < 0) {
            p.y = height;
            p.x = Math.random() * width;
        }

        ctx.fillStyle = `rgba(0,240,255,${p.alpha})`;
        ctx.fillRect(p.x, p.y, p.size, p.size);
    });

    requestAnimationFrame(animate);
}

window.addEventListener("resize", resize);

resize();
animate();
</script>

</body>
</html>
